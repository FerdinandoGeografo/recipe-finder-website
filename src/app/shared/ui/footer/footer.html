<footer class="footer">
  <div class="footer__inner">
    <p class="footer__text text-preset-9">Made with ❤️ and 🥑</p>

    <nav class="footer__socials" aria-label="Social media">
      @for (social of socialLinks; track social.name) {
        <a class="footer__social footer__social--{{ social.name }}" [href]="social.url" [attr.aria-label]="social.label">
          <mat-icon [svgIcon]="'custom:' + social.name" aria-hidden="true" />
        </a>
      }
    </nav>
  </div>
</footer>
