<header class="header">
  <div class="header__inner">
    <a
      class="header__logo-link"
      animate.enter="drop-enter"
      routerLink="/home"
      aria-label="Healthy Recipe Finder — Home"
    >
      <app-logo aria-hidden="true" />
    </a>
    <button
      #menuTrigger="matMenuTrigger"
      class="header__toggle"
      animate.enter="drop-enter"
      type="button"
      [matMenuTriggerFor]="mobileMenu"
      [attr.aria-label]="menuTrigger.menuOpen ? 'Close menu' : 'Open menu'"
    >
      <mat-icon svgIcon="custom:hamburger" aria-hidden="true" />
    </button>
    <nav #navigation class="header__nav" aria-label="Primary">
      <ul class="header__links">
        @for (link of navigationLinks; track link.path) {
          <li>
            <a
              class="header__nav-link text-preset-7"
              [routerLink]="link.path"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              <span>{{ link.label }}</span>
            </a>
          </li>
        }
      </ul>
      <a class="header__browse" animate.enter="drop-enter" matButton="filled" routerLink="/recipes">
        Browse recipes
      </a>
    </nav>
  </div>
</header>

<mat-menu
  #mobileMenu="matMenu"
  class="header-menu"
  xPosition="before"
  [overlapTrigger]="false"
  aria-label="Primary navigation"
>
  @for (link of navigationLinks; track link.path) {
    <a
      mat-menu-item
      class="header-menu__link"
      [routerLink]="link.path"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="header-menu__label">{{ link.label }}</span>
    </a>
  }
  <a mat-menu-item class="header-menu__browse" routerLink="/recipes">Browse recipes</a>
</mat-menu>
