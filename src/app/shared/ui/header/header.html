<header class="header">
  <div class="header__inner">
    <a
      class="header__logo-link"
      animate.enter="drop-enter"
      routerLink="/home"
      aria-label="Healthy Recipe Finder — Home"
    >
      <app-logo aria-hidden="true" />
    </a>
    <button
      #menuButton
      class="header__toggle"
      animate.enter="drop-enter"
      type="button"
      aria-controls="primary-nav"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.update((open) => !open)"
    >
      <mat-icon svgIcon="custom:hamburger" aria-hidden="true" />
      <span class="cdk-visually-hidden">Menu</span>
    </button>
    <nav
      #navigation
      id="primary-nav"
      class="header__nav"
      [class.header__nav--open]="menuOpen()"
      aria-label="Primary"
    >
      <ul class="header__links">
        @for (link of navigationLinks; track link.path) {
          <li>
            <a
              class="header__nav-link text-preset-7"
              [routerLink]="link.path"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              <span>{{ link.label }}</span>
            </a>
          </li>
        }
      </ul>
      <a
        class="header__browse"
        animate.enter="drop-enter"
        matButton="filled"
        routerLink="/recipes"
      >
        Browse recipes
      </a>
    </nav>
  </div>
</header>
