<section class="real-life" aria-labelledby="real-life-heading">
  <div class="real-life__text" appReveal>
    <h2 id="real-life-heading" class="text-preset-2">Built for real life</h2>
    <p class="text-preset-6">
      Cooking shouldn’t be complicated. These recipes come in under
      <span>30 minutes</span>
      of active time, fit busy schedules, and taste good enough to repeat.
    </p>
    <p class="text-preset-6">
      Whether you’re new to the kitchen or just need fresh ideas, we’ve got you
      covered.
    </p>
  </div>
  <img
    class="real-life__img"
    appReveal
    ngSrc="/images/image-home-real-life-small.webp"
    srcset="/images/image-home-real-life-small.webp 686w, /images/image-home-real-life-large.webp 1270w"
    sizes="(min-width: 64em) min(44vw, 39.7rem), (min-width: 48em) calc(100vw - 4rem), calc(100vw - 2rem)"
    disableOptimizedSrcset
    width="686"
    height="487"
    alt="A cook chopping fresh vegetables on a wooden board."
  />
</section>
