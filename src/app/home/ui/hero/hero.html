<section class="hero" aria-labelledby="home-heading">
  <div class="hero__decoration" aria-hidden="true">
    <img src="/images/pattern-squiggle-1.svg" width="1440" height="616" alt="" />
  </div>
  <div class="hero__text" animate.enter="page-enter">
    <h1 id="home-heading" class="hero__title heading heading--3xl">
      <span class="hero__highlight">Healthy</span> meals, zero fuss
    </h1>
    <p class="hero__subtitle heading heading--md">
      Discover eight quick, whole-food recipes that you can cook tonight—no
      processed junk, no guesswork.
    </p>
    <a matButton="filled" routerLink="/recipes">Start exploring</a>
  </div>
  <picture class="hero__picture" animate.enter="fade-enter">
    <source
      media="(min-width: 48em)"
      srcset="/images/image-home-hero-large.webp"
      width="2384"
      height="1060"
    />
    <img
      class="hero__img"
      src="/images/image-home-hero-small.webp"
      width="686"
      height="400"
      fetchpriority="high"
      alt="A woman holding a board of sliced cucumber while preparing a salad."
    />
  </picture>
</section>
