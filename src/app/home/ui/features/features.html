<section class="features" aria-labelledby="features-heading">
  <h2 appReveal id="features-heading" class="heading heading--2xl">What you’ll get</h2>

  <ul class="features__list">
    @for (feature of features; track feature.title) {
      <li class="feature" appReveal>
        <div class="feature__icon-box">
          <mat-icon
            class="feature__icon feature__icon--{{ feature.icon }}"
            aria-hidden="true"
            [svgIcon]="'custom:' + feature.icon"
          />
        </div>

        <div class="feature__text">
          <h3 class="heading heading--lg">{{ feature.title }}</h3>
          <p class="heading heading--md">{{ feature.description }}</p>
        </div>
      </li>
    }
  </ul>
</section>
