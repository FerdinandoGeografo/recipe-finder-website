<section class="about-list">
  <h2 appReveal class="about-list__title heading heading--2xl">{{ heading() }}</h2>

  <ul class="about-list__list">
    @for (item of items(); track item.heading) {
      <li class="about-list__item" appReveal>
        <mat-icon class="about-list__icon" svgIcon="custom:bullet-point" aria-hidden="true" />

        <div class="about-list__text">
          <h3 class="about-list__heading">{{ item.heading }}</h3>
          <p class="heading heading--md">{{ item.description }}</p>
        </div>
      </li>
    }
  </ul>
</section>
