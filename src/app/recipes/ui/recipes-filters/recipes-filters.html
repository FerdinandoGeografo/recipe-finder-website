@for (definition of timeFilters; track definition.key) {
  @let selected = filter()[definition.key];
  <button
    matButton="outlined"
    type="button"
    class="filters__trigger"
    [class.filters__trigger--selected]="selected !== undefined"
    [matMenuTriggerFor]="menu"
    [attr.aria-label]="selected === undefined ? definition.label : definition.label + ', ' + selected + ' minutes'"
  >
    {{ definition.label }}
    <mat-icon svgIcon="custom:chevron-down" aria-hidden="true" />
  </button>

  <mat-menu
    #menu="matMenu"
    class="recipe-filter-menu"
    [overlapTrigger]="false"
    [aria-label]="definition.label + ' options'"
  >
    @for (minutes of definition.options; track minutes) {
      <button
        mat-menu-item
        type="button"
        class="recipe-filter-menu__option"
        [class.recipe-filter-menu__option--selected]="selected === minutes"
        [attr.aria-label]="minutes + ' minutes' + (selected === minutes ? ', selected' : '')"
        (click)="selectTime(definition.key, minutes)"
      >
        <span class="recipe-filter-menu__indicator" aria-hidden="true"></span>
        {{ minutes }} minutes
      </button>
    }
    <button
      mat-menu-item
      type="button"
      class="recipe-filter-menu__clear"
      [attr.aria-label]="'Clear ' + definition.label"
      (click)="selectTime(definition.key)"
    >
      Clear
    </button>
  </mat-menu>
}

<mat-form-field
  subscriptSizing="dynamic"
  appearance="outline"
  class="filters__search"
>
  <input
    matInput
    type="search"
    aria-label="Search recipes by name or ingredient"
    placeholder="Search by name or ingredient…"
    [value]="filter().query"
    (input)="searchRecipes($event)"
  />
  <mat-icon matPrefix svgIcon="custom:search" aria-hidden="true" />
</mat-form-field>
